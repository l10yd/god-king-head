<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ГОЛОВА БОГА-КОРОЛЯ</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <style>
    /* Базовый reset + тёмный фон, чтобы не было белой вспышки до загрузки */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      color: #cfd6e4; user-select: none; -webkit-user-select: none;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    /* ВНИМАНИЕ: не ставить `#ui > * { pointer-events: auto }` — специфичность id
       перебивает .gk-screen.hidden и скрытые экраны ловили бы клики поверх кнопки.
       Интерактивные элементы включают pointer-events: auto сами (см. ui.css). */
    /* Экран загрузки */
    #boot {
      position: fixed; inset: 0; z-index: 50; background: #000;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      transition: opacity 1.2s ease; color: #5a6478; letter-spacing: .35em; font-size: 12px;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <div id="boot">ПРИЗЫВАНИЕ&nbsp;БОГА…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
